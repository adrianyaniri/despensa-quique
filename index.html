<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Despensa Quique — Fiambres, Bebidas y Almacén</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
  <link rel="icon" type="image/png" href="/logo/logo.png">
</head>
<body class="font-body text-ink min-h-screen antialiased flex flex-col justify-between bg-base selection:bg-espresso selection:text-white relative">

  <!-- ================== INTRO ANIMADA (EFECTO BUMPER DE MARCA) ================== -->
  <aside id="intro-curtain" class="intro-curtain fixed inset-0 z-50 bg-[#F8F5EE] flex flex-col items-center justify-center p-6 text-center cursor-pointer select-none">
    <div class="relative space-y-6 max-w-xs">
      <div class="absolute inset-0 -m-10 rounded-full bg-tan/20 blur-3xl anim-halo pointer-events-none"></div>

      <!-- Emblema de la Marca -->
      <div class="relative anim-intro-emblem">
        <img src="/logo/logo.png" alt="Despensa Quique"
             class="w-36 h-36 sm:w-40 sm:h-40 mx-auto rounded-3xl object-cover bg-white border border-line shadow-2xl p-1.5" />
      </div>

      <!-- Tipografía Animada con Barrido de Luz -->
      <div class="space-y-1 relative">
        <p class="text-[11px] font-black uppercase tracking-[0.3em] text-tan">Despensa</p>
        <h1 class="text-3xl sm:text-4xl font-black tracking-tight leading-none shimmer-text">
          Quique
        </h1>
        <p class="anim-intro-sub text-[10px] font-extrabold text-stone-500 uppercase tracking-widest pt-1">
          — Fiambres • Desde 2021 —
        </p>
      </div>

      <div class="pt-4">
        <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-[10px] font-semibold text-stone-400 bg-stone-200/50">
          <span>Tocá para ingresar</span>
        </span>
      </div>
    </div>
  </aside>

  <!-- ================== LANDING MINIMALISTA CENTRADA EN LA MARCA ================== -->
  <main class="max-w-md mx-auto px-6 py-10 sm:py-14 flex-1 flex flex-col items-center justify-center text-center space-y-8 w-full anim-hero">

    <!-- Emblema y Presencia de Marca Principal (Protagonista Absoluto) -->
    <div class="space-y-4">
      <div class="relative inline-block mx-auto">
        <div class="absolute inset-0 -m-4 rounded-full bg-tan/25 blur-2xl anim-halo pointer-events-none"></div>
        <img src="/logo/logo.png" alt="Logo Despensa Quique"
             class="relative w-36 h-36 sm:w-44 sm:h-44 mx-auto rounded-3xl object-cover bg-white border-2 border-line shadow-xl p-1.5 transition-transform hover:scale-102 duration-300" />
      </div>

      <div class="space-y-2">
        <div class="inline-flex items-center gap-1.5 rounded-full bg-stone-200/60 px-3 py-1 text-[11px] font-bold text-stone-700 border border-stone-300/60">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-600 animate-pulse"></span>
          <span>Abierto • Almacén de Barrio</span>
        </div>

        <h1 class="font-black text-3xl sm:text-4xl text-espresso tracking-tight leading-tight">
          Despensa Quique
        </h1>

        <p class="text-xs uppercase font-extrabold tracking-[0.2em] text-tan">
          Fiambres • Picadas • Bebidas
        </p>

        <p class="text-xs sm:text-sm text-muted max-w-xs mx-auto leading-relaxed pt-0.5">
          Quesos seleccionados, fiambres de calidad y tus compras de todos los días.
        </p>
      </div>
    </div>

    <!-- Acciones Secundarias Limpias y Sobrias (Sin Tarjetas Invasivas) -->
    <div class="w-full max-w-xs space-y-3 pt-2 anim-delay-1">

      <!-- Botón Primario: Ofertas del Día -->
      <a href="/ofertas"
         class="group flex items-center justify-between w-full rounded-2xl bg-espresso hover:bg-stone-900 active:scale-98 text-white font-extrabold px-5 py-3.5 text-xs sm:text-sm shadow-md transition-all cursor-pointer border border-stone-800">
        <span class="flex items-center gap-2">
          <span>🔥</span>
          <span>Ver Ofertas del Día</span>
        </span>
        <span class="text-tan group-hover:translate-x-1 transition-transform">&rarr;</span>
      </a>

      <!-- Botones Secundarios: WhatsApp e Instagram en Fila Compacta -->
      <div class="grid grid-cols-2 gap-2.5">
        <a id="btn-wa-landing" href="#" target="_blank" rel="noopener"
           class="flex items-center justify-center gap-1.5 rounded-xl bg-white hover:bg-stone-50 active:scale-95 text-stone-800 border border-line py-2.5 text-xs font-bold shadow-2xs transition-all cursor-pointer">
          <span class="text-wa text-sm leading-none">✆</span>
          <span>WhatsApp</span>
        </a>

        <a id="landing-ig-btn" href="/ig" target="_blank" rel="noopener"
           class="flex items-center justify-center gap-1.5 rounded-xl bg-white hover:bg-stone-50 active:scale-95 text-stone-800 border border-line py-2.5 text-xs font-bold shadow-2xs transition-all cursor-pointer">
          <span class="text-sm leading-none">📷</span>
          <span>Instagram</span>
        </a>
      </div>
    </div>

  </main>

  <!-- Pie Discreto y Minimalista -->
  <footer class="py-5 text-center text-[11px] text-muted border-t border-line/60 bg-base">
    <p>Despensa Quique • Desde 2021</p>
  </footer>

  <script type="module" src="/src/landing.js"></script>
</body>
</html>
