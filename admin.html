<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Despensa Quique</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: { base: '#FFFEFB', ink: '#1F1C19', muted: '#7A736C', line: '#EDE7DD', wa: '#25D366' },
      fontFamily: { body: ['Inter', 'system-ui', 'sans-serif'] }
    }
  }
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Supabase JS Client v2 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<style>
  body { background: #F8F6F0; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>
<body class="font-body text-ink min-h-screen antialiased flex flex-col">

<!-- Toast Notification -->
<div id="toast" class="fixed top-4 right-4 z-50 transform -translate-y-12 opacity-0 pointer-events-none transition-all duration-300 bg-ink text-white px-4 py-2.5 rounded-2xl shadow-xl text-xs font-semibold flex items-center gap-2">
  <span id="toast-icon">✓</span>
  <span id="toast-msg">Acción completada</span>
</div>

<!-- ================== VISTA DE LOGIN ================== -->
<div id="login-view" class="flex-1 flex items-center justify-center p-4">
  <div class="w-full max-w-sm bg-white rounded-3xl border border-line p-6 shadow-xl">
    <div class="text-center mb-6">
      <img src="./logo/logo.png" alt="Despensa Quique" class="w-16 h-16 rounded-2xl mx-auto border border-line shadow-xs object-cover" />
      <h1 class="text-xl font-extrabold text-ink mt-3">Panel de Control</h1>
      <p class="text-xs text-muted mt-0.5">Despensa Quique</p>
    </div>

    <form id="login-form" class="space-y-3.5">
      <div>
        <label class="block text-xs font-semibold text-stone-700 mb-1">Correo electrónico</label>
        <input id="login-email" type="email" required placeholder="admin@despensa.com"
          class="w-full rounded-xl bg-stone-50 border border-line px-3.5 py-2.5 text-sm outline-none focus:bg-white focus:ring-2 focus:ring-ink/10 focus:border-stone-400 transition-all" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-stone-700 mb-1">Contraseña</label>
        <input id="login-password" type="password" required placeholder="••••••••"
          class="w-full rounded-xl bg-stone-50 border border-line px-3.5 py-2.5 text-sm outline-none focus:bg-white focus:ring-2 focus:ring-ink/10 focus:border-stone-400 transition-all" />
      </div>

      <div id="login-error" class="hidden text-xs text-red-600 bg-red-50 p-2.5 rounded-xl border border-red-200"></div>

      <button id="login-btn" type="submit"
        class="w-full rounded-xl bg-ink text-white py-3 text-xs font-bold hover:bg-stone-800 active:scale-95 transition-all shadow-xs">
        Iniciar Sesión
      </button>
    </form>

    <div class="mt-5 pt-4 border-t border-line text-center">
      <a href="./index.html" class="text-xs text-muted hover:text-ink underline">Volver a la tienda</a>
    </div>
  </div>
</div>

<!-- ================== VISTA DE DASHBOARD ================== -->
<div id="dashboard-view" class="hidden flex-1 flex flex-col">
  <!-- Header Admin -->
  <header class="sticky top-0 z-30 bg-white border-b border-line shadow-xs">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5 min-w-0">
        <img src="./logo/logo.png" alt="Despensa Quique" class="w-9 h-9 rounded-xl border border-line object-cover shrink-0" />
        <div class="min-w-0">
          <h1 class="font-extrabold text-sm leading-tight truncate">Administración</h1>
          <p id="user-email" class="text-[11px] text-muted truncate">admin</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <a href="./index.html" target="_blank" class="rounded-xl border border-line px-3 py-1.5 text-xs font-semibold text-stone-700 hover:bg-stone-50 transition-colors hidden sm:inline-flex items-center gap-1">
          <span>Ver web</span> ↗
        </a>
        <button id="logout-btn" class="rounded-xl bg-stone-100 hover:bg-stone-200 px-3 py-1.5 text-xs font-bold text-stone-700 transition-colors">
          Salir
        </button>
      </div>
    </div>
  </header>

  <!-- Contenido Admin -->
  <main class="max-w-4xl mx-auto px-4 py-6 flex-1 w-full space-y-5">
    <!-- Métricas Rápidas -->
    <div class="grid grid-cols-3 gap-3">
      <div class="bg-white rounded-2xl border border-line p-3.5 shadow-xs">
        <p class="text-[11px] font-semibold text-muted uppercase">Total</p>
        <p id="stat-total" class="text-xl font-extrabold text-ink mt-0.5">0</p>
      </div>
      <div class="bg-white rounded-2xl border border-line p-3.5 shadow-xs">
        <p class="text-[11px] font-semibold text-emerald-700 uppercase">En stock</p>
        <p id="stat-active" class="text-xl font-extrabold text-emerald-600 mt-0.5">0</p>
      </div>
      <div class="bg-white rounded-2xl border border-line p-3.5 shadow-xs">
        <p class="text-[11px] font-semibold text-rose-700 uppercase">Sin stock</p>
        <p id="stat-inactive" class="text-xl font-extrabold text-rose-600 mt-0.5">0</p>
      </div>
    </div>

    <!-- Barra de Búsqueda y Botón Nuevo -->
    <div class="flex flex-col sm:flex-row gap-2.5 items-stretch sm:items-center justify-between">
      <div class="relative flex-1">
        <input id="admin-search" type="search" placeholder="Buscar por nombre o categoría..."
          class="w-full rounded-2xl bg-white border border-line pl-10 pr-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-ink/10 focus:border-stone-400 transition-all shadow-xs" />
        <span class="absolute left-3.5 top-3 text-stone-400 text-xs">🔍</span>
      </div>
      <button id="add-product-btn" class="rounded-2xl bg-ink text-white px-5 py-2.5 text-xs font-bold hover:bg-stone-800 active:scale-95 transition-all shadow-xs flex items-center justify-center gap-1.5 shrink-0">
        <span class="text-sm">+</span>
        <span>Nuevo Producto</span>
      </button>
    </div>

    <!-- Filtros de categoría -->
    <div id="admin-categories" class="flex gap-1.5 overflow-x-auto no-scrollbar py-0.5">
      <!-- Dinámico -->
    </div>

    <!-- Lista de Productos -->
    <div class="bg-white rounded-3xl border border-line shadow-xs overflow-hidden">
      <div id="products-table" class="divide-y divide-line">
        <!-- Render dinámico -->
      </div>
    </div>
  </main>
</div>

<!-- ================== MODAL AGREGAR / EDITAR PRODUCTO ================== -->
<dialog id="product-modal" class="rounded-3xl p-0 w-[min(94vw,32rem)] border border-line shadow-2xl backdrop:bg-ink/40">
  <div class="p-6 bg-white flex flex-col max-h-[90vh]">
    <div class="flex items-center justify-between pb-3 border-b border-line">
      <h2 id="modal-title" class="font-extrabold text-lg text-ink">Nuevo Producto</h2>
      <button onclick="closeProductModal()" class="w-8 h-8 rounded-full bg-stone-100 hover:bg-stone-200 text-stone-600 font-bold text-xs flex items-center justify-center transition-colors">✕</button>
    </div>

    <form id="product-form" class="mt-4 space-y-3.5 overflow-y-auto pr-1">
      <input type="hidden" id="prod-id" />

      <div>
        <label class="block text-xs font-semibold text-stone-700 mb-1">Nombre del producto *</label>
        <input id="prod-name" required placeholder="Ej: Fernet Branca 750 ml"
          class="w-full rounded-xl bg-stone-50 border border-line px-3.5 py-2 text-sm outline-none focus:bg-white focus:ring-2 focus:ring-ink/10 focus:border-stone-400 transition-all" />
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-stone-700 mb-1">Categoría *</label>
          <input id="prod-category" required placeholder="Ej: Bebidas" list="category-suggestions"
            class="w-full rounded-xl bg-stone-50 border border-line px-3.5 py-2 text-sm outline-none focus:bg-white focus:ring-2 focus:ring-ink/10 focus:border-stone-400 transition-all" />
          <datalist id="category-suggestions">
            <option value="Bebidas"></option>
            <option value="Cervezas"></option>
            <option value="Promos"></option>
            <option value="Picadas"></option>
            <option value="Snacks"></option>
            <option value="Almacén"></option>
          </datalist>
        </div>

        <div>
          <label class="block text-xs font-semibold text-stone-700 mb-1">Precio ($) *</label>
          <input id="prod-price" type="number" step="50" min="0" required placeholder="Ej: 3500"
            class="w-full rounded-xl bg-stone-50 border border-line px-3.5 py-2 text-sm outline-none focus:bg-white focus:ring-2 focus:ring-ink/10 focus:border-stone-400 transition-all font-bold" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-stone-700 mb-1">Descripción (opcional)</label>
        <input id="prod-desc" placeholder="Ej: Botella retornable, bien fría..."
          class="w-full rounded-xl bg-stone-50 border border-line px-3.5 py-2 text-sm outline-none focus:bg-white focus:ring-2 focus:ring-ink/10 focus:border-stone-400 transition-all" />
      </div>

      <div class="flex items-center justify-between p-3 rounded-2xl bg-stone-50 border border-line">
        <div>
          <p class="text-xs font-bold text-ink">Estado de disponibilidad</p>
          <p class="text-[11px] text-muted">¿Está disponible para que los clientes lo pidan?</p>
        </div>
        <label class="relative inline-flex items-center cursor-pointer">
          <input id="prod-available" type="checkbox" checked class="sr-only peer">
          <div class="w-11 h-6 bg-stone-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-stone-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-500"></div>
        </label>
      </div>

      <div class="pt-3 flex gap-2">
        <button type="button" onclick="closeProductModal()" class="flex-1 rounded-xl bg-stone-100 hover:bg-stone-200 py-2.5 text-xs font-bold text-stone-700 transition-colors">Cancelar</button>
        <button id="save-prod-btn" type="submit" class="flex-1 rounded-xl bg-ink text-white py-2.5 text-xs font-bold hover:bg-stone-800 transition-colors shadow-xs">Guardar</button>
      </div>
    </form>
  </div>
</dialog>

<script>
const cfg = window.QUIQUE_CONFIG || {};
const sbClient = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

let products = [];
let activeAdminCat = 'Todos';
let adminQuery = '';

// Toast Helper
function showToast(msg, isError = false) {
  const toast = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  document.getElementById('toast-icon').textContent = isError ? '⚠' : '✓';
  toast.className = `fixed top-4 right-4 z-50 transition-all duration-300 ${isError ? 'bg-red-600' : 'bg-ink'} text-white px-4 py-2.5 rounded-2xl shadow-xl text-xs font-semibold flex items-center gap-2 transform translate-y-0 opacity-100 pointer-events-auto`;
  setTimeout(() => {
    toast.className = 'fixed top-4 right-4 z-50 transition-all duration-300 bg-ink text-white px-4 py-2.5 rounded-2xl shadow-xl text-xs font-semibold flex items-center gap-2 transform -translate-y-12 opacity-0 pointer-events-none';
  }, 2500);
}

// Auth State Listener
sbClient.auth.onAuthStateChange((event, session) => {
  if (session) {
    document.getElementById('login-view').classList.add('hidden');
    document.getElementById('dashboard-view').classList.remove('hidden');
    document.getElementById('user-email').textContent = session.user.email;
    loadProducts();
  } else {
    document.getElementById('login-view').classList.remove('hidden');
    document.getElementById('dashboard-view').classList.add('hidden');
  }
});

// Login Form
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errorBox = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');

  errorBox.classList.add('hidden');
  btn.disabled = true;
  btn.textContent = 'Verificando...';

  const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
  btn.disabled = false;
  btn.textContent = 'Iniciar Sesión';

  if (error) {
    errorBox.textContent = 'Credenciales inválidas: ' + error.message;
    errorBox.classList.remove('hidden');
  } else {
    showToast('Bienvenido al panel');
  }
});

// Logout
document.getElementById('logout-btn').addEventListener('click', async () => {
  await sbClient.auth.signOut();
  showToast('Sesión cerrada');
});

// Cargar productos de Supabase
async function loadProducts() {
  const table = document.getElementById('products-table');
  table.innerHTML = '<div class="p-8 text-center text-xs text-muted">Cargando catálogo desde la base de datos...</div>';

  const { data, error } = await sbClient
    .from('productos')
    .select('*')
    .order('created_at', { ascending: true });

  if (error) {
    table.innerHTML = `<div class="p-8 text-center text-xs text-red-600 font-bold">Error al cargar productos: ${error.message}</div>`;
    return;
  }

  products = data || [];
  renderStats();
  renderCategories();
  renderProducts();
}

function renderStats() {
  const total = products.length;
  const active = products.filter(p => p.disponible).length;
  const inactive = total - active;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-active').textContent = active;
  document.getElementById('stat-inactive').textContent = inactive;
}

function renderCategories() {
  const catBox = document.getElementById('admin-categories');
  const cats = ['Todos', ...new Set(products.map(p => p.categoria).filter(Boolean))];
  catBox.innerHTML = cats.map(c => `
    <button onclick="setAdminCategory('${c}')" class="shrink-0 rounded-full px-3.5 py-1.5 text-xs font-semibold transition-all ${
      c === activeAdminCat ? 'bg-ink text-white shadow-xs' : 'bg-white border border-line text-stone-600 hover:bg-stone-100'
    }">${c}</button>
  `).join('');
}

window.setAdminCategory = (cat) => {
  activeAdminCat = cat;
  renderCategories();
  renderProducts();
};

document.getElementById('admin-search').addEventListener('input', (e) => {
  adminQuery = e.target.value.toLowerCase().trim();
  renderProducts();
});

function renderProducts() {
  const table = document.getElementById('products-table');
  const filtered = products.filter(p => {
    const matchesCat = activeAdminCat === 'Todos' || p.categoria === activeAdminCat;
    const matchesQuery = (p.nombre + ' ' + (p.descripcion || '') + ' ' + p.categoria).toLowerCase().includes(adminQuery);
    return matchesCat && matchesQuery;
  });

  if (!filtered.length) {
    table.innerHTML = '<div class="p-8 text-center text-xs text-muted">No se encontraron productos coincidentes.</div>';
    return;
  }

  table.innerHTML = filtered.map(p => {
    const isAvailable = p.disponible !== false;
    return `
    <div class="p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:bg-stone-50/70 transition-colors">
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2">
          <span class="inline-block px-2 py-0.5 rounded-md text-[10px] font-bold uppercase ${
            p.categoria === 'Bebidas' ? 'bg-blue-50 text-blue-700' :
            p.categoria === 'Cervezas' ? 'bg-amber-50 text-amber-700' :
            p.categoria === 'Promos' ? 'bg-purple-50 text-purple-700' :
            p.categoria === 'Picadas' ? 'bg-rose-50 text-rose-700' : 'bg-stone-100 text-stone-700'
          }">${p.categoria}</span>
          <p class="font-bold text-sm text-ink truncate">${p.nombre}</p>
        </div>
        ${p.descripcion ? `<p class="text-xs text-muted truncate mt-0.5">${p.descripcion}</p>` : ''}
      </div>

      <div class="flex items-center justify-between sm:justify-end gap-3 shrink-0 pt-2 sm:pt-0 border-t sm:border-0 border-stone-100">
        <!-- Input de Precio Rápido -->
        <div class="flex items-center gap-1">
          <span class="text-xs font-bold text-stone-400">$</span>
          <input type="number" step="50" min="0" value="${p.precio}"
            onchange="updatePrice('${p.id}', this.value)"
            class="w-20 rounded-xl bg-stone-100 border border-stone-200 px-2 py-1.5 text-xs font-extrabold text-ink outline-none focus:bg-white focus:border-stone-400 text-right transition-all" />
        </div>

        <!-- Switch de Stock -->
        <label class="flex items-center gap-1.5 cursor-pointer select-none">
          <input type="checkbox" ${isAvailable ? 'checked' : ''} onchange="toggleStock('${p.id}', this.checked)" class="sr-only peer">
          <div class="w-9 h-5 bg-stone-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-stone-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500 relative"></div>
          <span class="text-[11px] font-semibold ${isAvailable ? 'text-emerald-700' : 'text-stone-400'} w-14">
            ${isAvailable ? 'En stock' : 'Agotado'}
          </span>
        </label>

        <!-- Botones de Acción -->
        <div class="flex items-center gap-1">
          <button onclick="openEditModal('${p.id}')" title="Editar detalles" class="w-8 h-8 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-700 font-bold text-xs flex items-center justify-center transition-colors">✎</button>
          <button onclick="deleteProduct('${p.id}', '${p.nombre.replace(/'/g, "\\'")}')" title="Eliminar" class="w-8 h-8 rounded-xl bg-stone-100 hover:bg-rose-100 text-stone-700 hover:text-rose-600 font-bold text-xs flex items-center justify-center transition-colors">🗑</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

// Modificar Precio en Tiempo Real
window.updatePrice = async (id, newPrice) => {
  const priceNum = parseFloat(newPrice);
  if (isNaN(priceNum) || priceNum < 0) {
    showToast('Precio inválido', true);
    return;
  }

  const { error } = await sbClient
    .from('productos')
    .update({ precio: priceNum })
    .eq('id', id);

  if (error) {
    showToast('Error al actualizar precio: ' + error.message, true);
  } else {
    const prod = products.find(p => p.id === id);
    if (prod) prod.precio = priceNum;
    showToast(`Precio actualizado: $${priceNum.toLocaleString('es-AR')}`);
  }
};

// Alternar Stock en Tiempo Real
window.toggleStock = async (id, isAvailable) => {
  const { error } = await sbClient
    .from('productos')
    .update({ disponible: isAvailable })
    .eq('id', id);

  if (error) {
    showToast('Error al actualizar stock: ' + error.message, true);
    renderProducts();
  } else {
    const prod = products.find(p => p.id === id);
    if (prod) prod.disponible = isAvailable;
    renderStats();
    renderProducts();
    showToast(isAvailable ? 'Producto marcado como En Stock' : 'Producto marcado como Agotado');
  }
};

// Eliminar Producto
window.deleteProduct = async (id, nombre) => {
  if (!confirm(`¿Estás seguro de que querés eliminar "${nombre}" del catálogo?`)) return;

  const { error } = await sbClient
    .from('productos')
    .delete()
    .eq('id', id);

  if (error) {
    showToast('Error al eliminar: ' + error.message, true);
  } else {
    products = products.filter(p => p.id !== id);
    renderStats();
    renderCategories();
    renderProducts();
    showToast(`"${nombre}" eliminado`);
  }
};

// Modal Agregar / Editar
const modal = document.getElementById('product-modal');
document.getElementById('add-product-btn').onclick = () => {
  document.getElementById('modal-title').textContent = 'Nuevo Producto';
  document.getElementById('prod-id').value = '';
  document.getElementById('prod-name').value = '';
  document.getElementById('prod-category').value = activeAdminCat === 'Todos' ? 'Bebidas' : activeAdminCat;
  document.getElementById('prod-price').value = '';
  document.getElementById('prod-desc').value = '';
  document.getElementById('prod-available').checked = true;
  modal.showModal();
};

window.openEditModal = (id) => {
  const p = products.find(x => x.id === id);
  if (!p) return;
  document.getElementById('modal-title').textContent = 'Editar Producto';
  document.getElementById('prod-id').value = p.id;
  document.getElementById('prod-name').value = p.nombre;
  document.getElementById('prod-category').value = p.categoria;
  document.getElementById('prod-price').value = p.precio;
  document.getElementById('prod-desc').value = p.descripcion || '';
  document.getElementById('prod-available').checked = p.disponible !== false;
  modal.showModal();
};

window.closeProductModal = () => modal.close();

// Guardar Producto (Nuevo o Edición)
document.getElementById('product-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const idInput = document.getElementById('prod-id').value;
  const name = document.getElementById('prod-name').value.trim();
  const category = document.getElementById('prod-category').value.trim();
  const price = parseFloat(document.getElementById('prod-price').value);
  const desc = document.getElementById('prod-desc').value.trim();
  const available = document.getElementById('prod-available').checked;

  const saveBtn = document.getElementById('save-prod-btn');
  saveBtn.disabled = true;
  saveBtn.textContent = 'Guardando...';

  if (idInput) {
    // Edición
    const { error } = await sbClient
      .from('productos')
      .update({
        nombre: name,
        categoria: category,
        precio: price,
        descripcion: desc,
        disponible: available
      })
      .eq('id', idInput);

    saveBtn.disabled = false;
    saveBtn.textContent = 'Guardar';

    if (error) {
      showToast('Error al editar: ' + error.message, true);
    } else {
      closeProductModal();
      showToast('Producto actualizado correctamente');
      loadProducts();
    }
  } else {
    // Creación
    const newId = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') + '-' + Date.now().toString().slice(-4);
    const { error } = await sbClient
      .from('productos')
      .insert({
        id: newId,
        nombre: name,
        categoria: category,
        precio: price,
        descripcion: desc,
        disponible: available,
        unidad: 'c/u'
      });

    saveBtn.disabled = false;
    saveBtn.textContent = 'Guardar';

    if (error) {
      showToast('Error al crear: ' + error.message, true);
    } else {
      closeProductModal();
      showToast('Producto creado con éxito');
      loadProducts();
    }
  }
});
</script>
</body>
</html>
